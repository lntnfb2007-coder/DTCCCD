    <title>Đăng nhập</title>
</head>

    table{
        background-color: rgb(196, 255, 128);
        margin: auto;
    
    }
</style>
<body>
    <form>
        <table>

                <td><label for="user">User</label></td>

            <tr>

                <td><input type="text" id="Pass"></td>
            </tr>
            <td colspan="2"><label for="nhott"> <input type="checkbox" name="nhott" id="nhott">Nhớ thông tin đăng nhập</label></td>
            </tr>
            <tr>
            <td align="center" colspan="2"><input type="button" value="Đồng ý" onclick="alert('bạn đã đăng nhập thành công')"></td>
        </tr>
        </table>
    </form>

</html>
